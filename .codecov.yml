# https://docs.codecov.io/docs/codecov-yaml
codecov:
  notify:
    require_ci_to_pass: yes

coverage:
  precision: 2
  round: up
  range: "65...100"

  status:
    project:
      default:
        target: 65%
    patch:
      default:
        target: 65%
    changes: no

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "header, diff"
  behavior: default
  require_changes: no

ignore:
  - "doc"
  - "sbt"
  -  "**/.js/**/*.scala"
